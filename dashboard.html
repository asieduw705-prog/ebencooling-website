<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Eben Cooling</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', sans-serif;
    background:#0b132b;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

/* LOGIN BOX */

.login-container{
    width:100%;
    max-width:400px;
    background:#1c2541;
    padding:2rem;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.5);
    text-align:center;
}

.login-container img{
    width:90px;
    margin-bottom:1rem;
}

.login-container h2{
    color:#5bc0be;
    margin-bottom:10px;
}

.login-container p{
    color:#ccc;
    margin-bottom:2rem;
}

/* INPUTS */

.input-box{
    margin-bottom:1rem;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:1rem;
}

/* BUTTON */

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:#5bc0be;
    color:#0b132b;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#3aafa9;
}

/* ERROR */

#error{
    color:red;
    margin-top:15px;
    display:none;
}

/* MOBILE */

@media(max-width:500px){

    body{
        padding:20px;
    }

}

</style>
</head>

<body>

<div class="login-container">

    <!-- LOGO -->

    <img
    src="images/logo.png"
    alt="Logo">

    <h2>Admin Login</h2>

    <p>
        Eben Cooling Dashboard Access
    </p>

    <!-- USERNAME -->

    <div class="input-box">

        <input
        type="text"
        id="username"
        placeholder="Enter Username">

    </div>

    <!-- PASSWORD -->

    <div class="input-box">

        <input
        type="password"
        id="password"
        placeholder="Enter Password">

    </div>

    <!-- LOGIN BUTTON -->

    <button onclick="login()">
        Login
    </button>

    <!-- ERROR -->

    <p id="error">
        Invalid Username or Password
    </p>

</div>

<script>

/* =========================
   ADMIN LOGIN DETAILS
========================= */

const ADMIN_USERNAME = "ebencooling";
const ADMIN_PASSWORD = "eben890";

/* =========================
   LOGIN FUNCTION
========================= */

function login(){

    let username =
    document.getElementById(
    "username"
    ).value.trim().toLowerCase();

    let password =
    document.getElementById(
    "password"
    ).value.trim();

    let error =
    document.getElementById(
    "error"
    );

    if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ){

        // SAVE LOGIN SESSION

        sessionStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        // REDIRECT

        window.location.href =
        "dashboard.html";

    }

    else{

        error.style.display =
        "block";

    }

}

/* =========================
   ENTER KEY SUPPORT
========================= */

document.addEventListener(
"keydown",

function(event){

    if(event.key === "Enter"){

        login();

    }

});

</script>

</body>
</html>
