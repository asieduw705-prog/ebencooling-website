<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eben Cooling Admin Dashboard</title>

<style>

/* =======================
   GLOBAL
======================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0b132b;
  color:white;
  display:flex;
  min-height:100vh;
}

/* =======================
   SIDEBAR
======================= */

.sidebar{
  width:250px;
  background:#1c2541;
  padding:20px;
}

.sidebar h2{
  color:#5bc0be;
  margin-bottom:20px;
}

.sidebar button{
  width:100%;
  margin:10px 0;
  padding:12px;
  border:none;
  background:#5bc0be;
  color:#0b132b;
  font-weight:bold;
  cursor:pointer;
  border-radius:8px;
}

.sidebar button:hover{
  background:#3aafa9;
}

/* =======================
   MAIN
======================= */

.main{
  flex:1;
  padding:20px;
}

/* =======================
   CARDS
======================= */

.card{
  background:#1c2541;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

/* INPUTS */

input, textarea, select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:6px;
}

/* BUTTON */

.btn{
  background:#5bc0be;
  color:#0b132b;
  border:none;
  padding:10px;
  width:100%;
  cursor:pointer;
  font-weight:bold;
  border-radius:8px;
}

.btn:hover{
  background:#3aafa9;
}

/* DELETE */

.delete{
  background:red;
  color:white;
  margin-top:10px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:10px;
}

img, video{
  width:100%;
  border-radius:10px;
}
/* =======================
   MOBILE FIX
======================= */

@media (max-width: 768px){

body{
    flex-direction: column;
}

/* SIDEBAR BECOMES TOP BAR */
.sidebar{
    width:100%;
    display:flex;
    overflow-x:auto;
    gap:10px;
    padding:10px;
    align-items:center;
}

.sidebar h2{
    display:none;
}

.sidebar button{
    flex:1;
    font-size:12px;
    padding:10px;
}

/* MAIN AREA */
.main{
    padding:10px;
}

/* CARDS */
.card{
    font-size:14px;
}

/* GRID FIX */
.grid{
    grid-template-columns:1fr;
}

/* BUTTONS */
.btn{
    font-size:14px;
}
</style>

</head>

<body>

<script>
if(localStorage.getItem("adminLoggedIn") !== "true"){
  window.location.href="login.html";
}
</script>

<!-- SIDEBAR -->
<div class="sidebar">

<h2>Admin Panel</h2>

<button onclick="show('orders')">Orders</button>
<button onclick="show('upload')">Upload</button>
<button onclick="show('gallery')">Gallery</button>

<button onclick="logout()">Logout</button>

</div>

<!-- MAIN -->
<div class="main">

<!-- ORDERS -->
<div id="orders" class="section">

<h2>Customer Orders</h2>
<div id="ordersList"></div>

</div>

<!-- UPLOAD -->
<div id="upload" class="section" style="display:none">

<h2>Upload Media</h2>

<input type="file" id="file">

<button class="btn" onclick="upload()">Upload</button>

<p id="status"></p>

</div>

<!-- GALLERY -->
<div id="gallery" class="section" style="display:none">

<h2>Gallery</h2>
<div class="grid" id="galleryList"></div>

</div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc,
addDoc,
onSnapshot,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyCPCVms848PCesjDjt03yhrpoiBFZry0nE",
authDomain: "eben-cooling.firebaseapp.com",
projectId: "eben-cooling",
storageBucket: "eben-cooling.firebasestorage.app",
messagingSenderId: "616090448214",
appId: "1:616090448214:web:3ea5624bc97eeaf53da6f7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* NAVIGATION */
window.show = function(id){
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
document.getElementById(id).style.display="block";
}

/* =======================
   ORDERS REALTIME
======================= */

onSnapshot(collection(db,"orders"),(snap)=>{

let html="";

snap.forEach(d=>{

let data=d.data();

html+=`
<div class="card">
<p><b>Name:</b> ${data.name}</p>
<p><b>Service:</b> ${data.service}</p>
<p><b>Status:</b> ${data.status || "Pending"}</p>

<button class="btn delete"
onclick="delOrder('${d.id}')">Delete</button>
</div>
`;

});

document.getElementById("ordersList").innerHTML=html;

});

/* DELETE ORDER */
window.delOrder=async(id)=>{
await deleteDoc(doc(db,"orders",id));
}

/* =======================
   UPLOAD TO CLOUDINARY
======================= */

const cloud="dnw3fdbhr";
const preset="ebencooling media";

window.upload=async()=>{

let file=document.getElementById("file").files[0];
let status=document.getElementById("status");

if(!file){alert("Select file");return;}

let type=file.type.startsWith("video")?"video":"image";

let form=new FormData();
form.append("file",file);
form.append("upload_preset",preset);

status.innerText="Uploading...";

let res=await fetch(
`https://api.cloudinary.com/v1_1/${cloud}/${type}/upload`,
{method:"POST",body:form}
);

let data=await res.json();

/* SAVE TO FIREBASE */
await addDoc(collection(db,"gallery"),{
url:data.secure_url,
type,
createdAt:serverTimestamp()
});

status.innerText="Uploaded!";
}

/* =======================
   GALLERY LOAD
======================= */

onSnapshot(collection(db,"gallery"),(snap)=>{

let html="";

snap.forEach(d=>{

let data=d.data();

if(data.type==="image"){
html+=`<img src="${data.url}">`;
}else{
html+=`<video controls src="${data.url}"></video>`;
}

});

document.getElementById("galleryList").innerHTML=html;

});

/* LOGOUT */
window.logout=()=>{
localStorage.removeItem("adminLoggedIn");
window.location.href="login.html";
}

</script>

</body>
</html>
