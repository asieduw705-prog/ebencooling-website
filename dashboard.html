<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | Eben Cooling</title>

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', sans-serif;
    background:#0b132b;
    color:white;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    background:#1c2541;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1rem 2rem;
}

header h1{
    color:#5bc0be;
}

.logout-btn{
    background:red;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
}

/* =========================
   HERO
========================= */

.hero{
    text-align:center;
    padding:4rem 2rem;
}

.hero h2{
    font-size:2.5rem;
    color:#5bc0be;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    padding:2rem;
    display:flex;
    justify-content:center;
}

.upload-box{
    width:100%;
    max-width:700px;
    background:#1c2541;
    padding:2rem;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

.file-input{
    border:2px dashed #5bc0be;
    padding:2rem;
    border-radius:15px;
    text-align:center;
    margin-bottom:1rem;
}

.file-input input{
    width:100%;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:#5bc0be;
    color:#0b132b;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#3aafa9;
}

/* STATUS */

#status{
    text-align:center;
    margin-top:1rem;
    color:#5bc0be;
}

/* PREVIEW */

.preview{
    margin-top:2rem;
}

.preview img,
.preview video{
    width:100%;
    border-radius:15px;
}

/* MOBILE */

@media(max-width:768px){

    header{
        flex-direction:column;
        gap:10px;
    }

    .dashboard{
        padding:1rem;
    }

}

</style>

</head>

<body>

<script>

/* =========================
   LOGIN PROTECTION
========================= */

if(
    localStorage.getItem(
    "adminLoggedIn"
    ) !== "true"
){

    window.location.href =
    "login.html";

}

</script>

<!-- HEADER -->

<header>

<h1>Eben Cooling Admin</h1>

<button
class="logout-btn"
onclick="logout()">

Logout

</button>

</header>

<!-- HERO -->

<section class="hero">

<h2>Gallery Upload System</h2>

<p>
Upload images and videos directly to your website gallery
</p>

</section>

<!-- DASHBOARD -->

<section class="dashboard">

<div class="upload-box">

<!-- FILE INPUT -->

<div class="file-input">

<input
type="file"
id="fileInput"
accept="image/*,video/*">

</div>

<!-- BUTTON -->

<button onclick="uploadFile()">

Upload Media

</button>

<!-- STATUS -->

<div id="status"></div>

<!-- PREVIEW -->

<div
class="preview"
id="preview"></div>

</div>

</section>

<!-- FIREBASE -->

<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

collection,

addDoc,

serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCPCVms848PCesjDjt03yhrpoiBFZry0nE",

  authDomain:
  "eben-cooling.firebaseapp.com",

  projectId:
  "eben-cooling",

  storageBucket:
  "eben-cooling.firebasestorage.app",

  messagingSenderId:
  "616090448214",

  appId:
  "1:616090448214:web:3ea5624bc97eeaf53da6f7"

};

/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* =========================
   CLOUDINARY SETTINGS
========================= */

const cloudName =
"dnw3fdbhr";

const uploadPreset =
"ebencooling media";

/* =========================
   UPLOAD FUNCTION
========================= */

window.uploadFile =
async function(){

const fileInput =
document.getElementById(
"fileInput"
);

const file =
fileInput.files[0];

const status =
document.getElementById(
"status"
);

const preview =
document.getElementById(
"preview"
);

if(!file){

    alert(
    "Please select a file"
    );

    return;

}

let uploadType = "";

/* DETECT FILE TYPE */

if(
file.type.startsWith(
"image"
)){

    uploadType =
    "image";

}

else if(
file.type.startsWith(
"video"
)){

    uploadType =
    "video";

}

else{

    alert(
    "Unsupported file"
    );

    return;

}

const formData =
new FormData();

formData.append(
"file",
file
);

formData.append(
"upload_preset",
uploadPreset
);

try{

    status.innerHTML =
    "Uploading media...";

    /* =========================
       UPLOAD TO CLOUDINARY
    ========================= */

    const response =
    await fetch(

    `https://api.cloudinary.com/v1_1/dnw3fdbhr/image/upload`,

    {
        method:"POST",
        body:formData
    }

    );

    const data =
    await response.json();

    console.log(data);

    /* =========================
       SAVE TO FIREBASE
    ========================= */

    await addDoc(

    collection(db,"gallery"),

    {

        url:data.secure_url,

        type:uploadType,

        createdAt:
        serverTimestamp()

    }

    );

    /* =========================
       SUCCESS
    ========================= */

    status.innerHTML =
    "✅ Upload successful";

    // IMAGE PREVIEW

    if(uploadType === "image"){

        preview.innerHTML =

        `
        <img
        src="${data.secure_url}">
        `;

    }

    // VIDEO PREVIEW

    else{

        preview.innerHTML =

        `
        <video controls>

        <source
        src="${data.secure_url}"
        type="video/mp4">

        </video>
        `;

    }

}

catch(error){

    console.log(error);

    status.innerHTML =
    "❌ Upload failed";

}

}

/* =========================
   LOGOUT
========================= */

window.logout =
function(){

localStorage.removeItem(
"adminLoggedIn"
);

window.location.href =
"login.html";

}

</script>

</body>
</html>
