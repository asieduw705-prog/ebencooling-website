<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Eben Cooling</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', sans-serif;
    background:#0b132b;
    color:white;
    min-height:100vh;
}

/* HEADER */

header{
    background:#1c2541;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1rem 2rem;
}

header h1{
    color:#5bc0be;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    color:#5bc0be;
}

/* HERO */

.hero{
    text-align:center;
    padding:4rem 2rem;
    background:linear-gradient(
    rgba(0,0,0,0.6),
    rgba(0,0,0,0.6)),
    url('images/banner.PNG')
    center/cover no-repeat;
}

.hero h2{
    font-size:2.5rem;
    margin-bottom:1rem;
}

.hero p{
    color:#ddd;
}

/* DASHBOARD */

.dashboard{
    padding:4rem 2rem;
    display:flex;
    justify-content:center;
}

.upload-box{
    background:#1c2541;
    width:100%;
    max-width:700px;
    padding:2rem;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

.upload-box h3{
    text-align:center;
    color:#5bc0be;
    margin-bottom:2rem;
    font-size:2rem;
}

/* FILE INPUT */

.file-input{
    border:2px dashed #5bc0be;
    padding:2rem;
    border-radius:15px;
    text-align:center;
    margin-bottom:1.5rem;
}

.file-input input{
    width:100%;
    color:white;
}

/* BUTTONS */

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:#5bc0be;
    color:#0b132b;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

button:hover{
    background:#3aafa9;
}

.logout-btn{
    background:red;
    color:white;
}

.logout-btn:hover{
    opacity:0.8;
}

/* STATUS */

.status{
    text-align:center;
    margin-top:1rem;
    color:#5bc0be;
    font-weight:bold;
}

/* PREVIEW */

.preview{
    margin-top:2rem;
}

.preview img,
.preview video{
    width:100%;
    border-radius:15px;
    margin-top:1rem;
}

/* FOOTER */

footer{
    background:#1c2541;
    text-align:center;
    padding:1rem;
    color:#ccc;
    margin-top:3rem;
}

/* MOBILE */

@media(max-width:768px){

    header{
        flex-direction:column;
        text-align:center;
    }

    nav{
        margin-top:10px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero h2{
        font-size:2rem;
    }

    .dashboard{
        padding:2rem 1rem;
    }

}

</style>
</head>

<body>

<!-- LOGIN PROTECTION -->

<script>

/* =========================
   CHECK LOGIN SESSION
========================= */

if(
    sessionStorage.getItem(
    "adminLoggedIn"
    ) !== "true"
){

    window.location.href =
    "login.html";

}

</script>

<!-- HEADER -->

<header>

    <h1>Eben Cooling</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="services.html">Services</a>

        <a href="gallery.html">Gallery</a>

        <a href="order.html">Orders</a>

        <a href="contact.html">Contact</a>

    </nav>

</header>

<!-- HERO -->

<section class="hero">

    <h2>Admin Dashboard</h2>

    <p>
        Upload and manage gallery images and videos
    </p>

</section>

<!-- DASHBOARD -->

<section class="dashboard">

<div class="upload-box">

    <h3>Upload Media</h3>

    <!-- FILE INPUT -->

    <div class="file-input">

        <input
        type="file"
        id="fileInput"
        accept="image/*,video/*">

    </div>

    <!-- UPLOAD BUTTON -->

    <button onclick="uploadFile()">
        Upload File
    </button>

    <!-- LOGOUT BUTTON -->

    <button
    class="logout-btn"
    onclick="logout()">
        Logout
    </button>

    <!-- STATUS -->

    <div
    class="status"
    id="status"></div>

    <!-- PREVIEW -->

    <div
    class="preview"
    id="preview"></div>

</div>

</section>

<!-- FOOTER -->

<footer>

    <p>
        © Eben Cooling 2025 — All Rights Reserved
    </p>

</footer>

<script>

/* =========================
   CLOUDINARY SETTINGS
========================= */

const cloudName =
"dnw3fdbhr";

const uploadPreset =
"gallery";

/* =========================
   UPLOAD FUNCTION
========================= */

async function uploadFile(){

    const fileInput =
    document.getElementById(
    "fileInput"
    );

    const file =
    fileInput.files[0];

    const preview =
    document.getElementById(
    "preview"
    );

    const status =
    document.getElementById(
    "status"
    );

    if(!file){

        alert(
        "Please select a file first."
        );

        return;
    }

    let uploadType = "";

    // DETECT FILE TYPE

    if(
    file.type.startsWith(
    "image"
    )){

        uploadType =
        "image";

    }

    else if(
    file.type.startsWith(
    "video"
    )){

        uploadType =
        "video";

    }

    else{

        alert(
        "Unsupported file type"
        );

        return;
    }

    const formData =
    new FormData();

    formData.append(
    "file",
    file
    );

    formData.append(
    "upload_preset",
    uploadPreset
    );

    try{

        status.innerHTML =
        "Uploading...";

        const response =
        await fetch(

        `https://api.cloudinary.com/v1_1/${cloudName}/${uploadType}/upload`,

        {
            method:"POST",
            body:formData
        }

        );

        const data =
        await response.json();

        console.log(data);

        status.innerHTML =
        "✅ Upload Successful";

        // IMAGE PREVIEW

        if(
        uploadType ===
        "image"
        ){

            preview.innerHTML =

            `
            <img
            src="${data.secure_url}"
            alt="Uploaded Image">
            `;

        }

        // VIDEO PREVIEW

        else{

            preview.innerHTML =

            `
            <video controls>

                <source
                src="${data.secure_url}"
                type="video/mp4">

            </video>
            `;

        }

        // SAVE TO LOCAL STORAGE

        let galleryItems =
        JSON.parse(
        localStorage.getItem(
        "gallery"
        )
        ) || [];

        galleryItems.push({

            url:data.secure_url,

            type:uploadType

        });

        localStorage.setItem(

            "gallery",

            JSON.stringify(
            galleryItems
            )

        );

    }

    catch(error){

        console.log(error);

        status.innerHTML =
        "❌ Upload Failed";

    }

}

/* =========================
   LOGOUT FUNCTION
========================= */

function logout(){

    sessionStorage.removeItem(
    "adminLoggedIn"
    );

    window.location.href =
    "login.html";

}

</script>

</body>
</html>
