<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', sans-serif;
    background:#0b132b;
    color:white;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    background:#1c2541;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1rem 2rem;
}

header h1{
    color:#5bc0be;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    color:#5bc0be;
}

/* =========================
   HERO
========================= */

.hero{
    text-align:center;
    padding:4rem 2rem;

    background:
    linear-gradient(
    rgba(0,0,0,0.6),
    rgba(0,0,0,0.6)),

    url('images/banner.PNG')
    center/cover no-repeat;
}

.hero h2{
    font-size:2.5rem;
    margin-bottom:1rem;
}

.hero p{
    color:#ddd;
}

/* =========================
   FORM SECTION
========================= */

.order-section{
    padding:4rem 2rem;
    display:flex;
    justify-content:center;
}

.form-box{
    width:100%;
    max-width:650px;
    background:#1c2541;
    padding:2rem;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

.form-box h3{
    text-align:center;
    color:#5bc0be;
    margin-bottom:2rem;
}

/* INPUTS */

.input-box{
    margin-bottom:1rem;
}

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:1rem;
}

/* BUTTON */

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:#5bc0be;
    color:#0b132b;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#3aafa9;
}

/* STATUS */

#status{
    margin-top:1rem;
    text-align:center;
    color:#5bc0be;
    font-weight:bold;
}

/* FOOTER */

footer{
    background:#1c2541;
    text-align:center;
    padding:1rem;
    color:#ccc;
    margin-top:3rem;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    header{
        flex-direction:column;
        text-align:center;
    }

    nav{
        margin-top:10px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero h2{
        font-size:2rem;
    }

    .order-section{
        padding:2rem 1rem;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

<h1>Eben Cooling</h1>

<nav>

<a href="index.html">Home</a>

<a href="services.html">Services</a>

<a href="gallery.html">Gallery</a>

<a href="contact.html">Contact</a>

</nav>

</header>

<!-- HERO -->

<section class="hero">

<h2>Book a Service</h2>

<p>
Professional cooling solutions for homes and offices
</p>

</section>

<!-- ORDER FORM -->

<section class="order-section">

<div class="form-box">

<h3>Service Request Form</h3>

<form id="orderForm">

<!-- FULL NAME -->

<div class="input-box">

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<!-- EMAIL -->

<div class="input-box">

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<!-- PHONE -->

<div class="input-box">

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

</div>

<!-- SERVICE -->

<div class="input-box">

<select id="service" required>

<option value="">
Select Service
</option>

<option>
AC Installation
</option>

<option>
Repairs
</option>

<option>
Servicing
</option>

<option>
Gas Refilling
</option>

</select>

</div>

<!-- MESSAGE -->

<div class="input-box">

<textarea
id="message"
rows="5"
placeholder="Additional Details"></textarea>

</div>

<!-- BUTTON -->

<button type="submit">

Submit Order

</button>

<div id="status"></div>

</form>

</div>

</section>

<!-- FOOTER -->


<!-- FIREBASE -->

<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import { initializeApp }

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

collection,

addDoc,

serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCPCVms848PCesjDjt03yhrpoiBFZry0nE",

  authDomain:
  "eben-cooling.firebaseapp.com",

  projectId:
  "eben-cooling",

  storageBucket:
  "eben-cooling.firebasestorage.app",

  messagingSenderId:
  "616090448214",

  appId:
  "1:616090448214:web:3ea5624bc97eeaf53da6f7"

};

/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* =========================
   FORM SUBMISSION
========================= */

const form =
document.getElementById(
"orderForm"
);

const status =
document.getElementById(
"status"
);

form.addEventListener(
"submit",

async function(e){

e.preventDefault();

status.innerHTML =
"Submitting order...";

try{

    await addDoc(

    collection(db,"orders"),

    {

        name:
        document.getElementById(
        "name"
        ).value,

        email:
        document.getElementById(
        "email"
        ).value,

        phone:
        document.getElementById(
        "phone"
        ).value,

        service:
        document.getElementById(
        "service"
        ).value,

        message:
        document.getElementById(
        "message"
        ).value,

        createdAt:
        serverTimestamp()

    }

    );

    status.innerHTML =
    "✅ Order submitted successfully";

    form.reset();

}

catch(error){

    console.log(error);

    status.innerHTML =
    "❌ Failed to submit order";

}

});

</script>
