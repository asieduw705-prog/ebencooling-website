<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eben Cooling</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-color: #0b132b;
  color: white;
  line-height: 1.6;
}
header {
  background: #1c2541;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
}
header h1 { color: #5bc0be; }
nav a {
  color: white;
  text-decoration: none;
  margin: 0 1rem;
  font-weight: bold;
}
nav a:hover { color: #5bc0be; }
section { padding: 3rem 2rem; text-align: center; }
.btn {
  background: #5bc0be;
  color: #0b132b;
  padding: 0.7rem 1.5rem;
  border: none;
  border-radius: 30px;
  font-weight: bold;
  cursor: pointer;
}
.btn:hover { background: #3aafa9; }
footer {
  background: #1c2541;
  text-align: center;
  padding: 1rem;
  color: #ccc;
  font-size: 0.9rem;
}
   

</style>
  <style>
    .hero {
      background: url('images/banner.PNG') center/cover no-repeat;
      text-align: center;
      padding: 8rem 2rem;
      color: white;
    }
    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <header>
    <h1>Eben Cooling</h1>
    <nav>
      <a href="services.html">Services</a>
      <a href="gallery.html">Gallery</a>
      <a href="order.html">Order</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

 
  <section class="hero">
    <h2>Expert Cooling Solutions for Homes & Offices</h2>
    <button class="btn" onclick="window.location.href='order.html'">Book a Service</button>
  </section>

 <style>
     gallery {
  display: grid;
  grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
  gap: 20px
  padding:20px;
}
gallery img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: transform 0.3s ease;
}


gallery img:hover {
  transform: scale(1.05);
}

  </style>
  <!-- 📸 Picture Gallery -->
  <section id="gallery" class="section">
    <h2>Our Work Gallery</h2>
    <div class="gallery">
      <img src="images/banner.PNG" alt="AC Installation">
      <img src="images/boss.PNG" alt="Repair Work">
      <img src="images/three.jpg" alt="Team on site">
      <img src="images/two.jpg" alt="AC Cleaning">
    </div>
  </section>

  <!-- 🎥 Video Section -->
  <section id="gallery" class="section">
    <h2>Watch Us in Action</h2>
    <div class="gallery">
      <video controls>
        <source src="images/Video.MP4" type="video/MP4">
        Your browser does not support the video tag.
      </video>

      <video controls>
        <source src="images/Video2.MP4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </section>

  <style>
    /* Social Media Section */
social-section {
    text-align: center;
    padding: 40px 20px;
    background: #f5f5f5;
}

social-section h2 {
    margin-bottom: 20px;
    font-size: 30px;
}

social-icons {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

social-icons img {
    width: 60px;
    height: 60px;
    transition: transform 0.3s ease;
}

social-icons img:hover {
    transform: scale(1.2);
}
  </style>
  <!-- Social Media Section -->
<section class="social-section">
    <h2>Connect With Us</h2>

    <div class="social-icons">
        <a href="https://facebook.com" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
        </a>

        <a href="https://instagram.com" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
        </a>

        <a href="https://twitter.com" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
        </a>

        <a href="https://wa.me/+233546272755" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
        </a>

        <a href="https://youtube.com" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube">
        </a>
    </div>
</section>
