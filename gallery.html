/* =========================

/* =========================
   HERO
========================= */

.hero{

    linear-gradient(

.hero p{

/* =========================
   GALLERY
========================= */

.gallery-section{
    padding:4rem 2rem;
}

.gallery-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,
    minmax(300px,1fr));

    gap:20px;
}

.gallery-item{
    background:#1c2541;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,0.4);
}

.gallery-item img,
.gallery-item video{
    width:100%;
    height:300px;
    object-fit:cover;
}

/* =========================
   LOADING
========================= */

    text-align:center;
    color:#5bc0be;
    padding:2rem;
    font-size:1.2rem;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#1c2541;
    text-align:center;
    padding:1rem;
    color:#ccc;
    margin-top:3rem;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    header{
        flex-direction:column;
        text-align:center;
    }

    nav{
        margin-top:10px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero h2{
        font-size:2rem;
    }

    .gallery-section{
        padding:2rem 1rem;
    }

}

</style>

<!-- LOADING -->

<div id="loading">

Loading gallery...

</div>

<!-- GALLERY -->

<section class="gallery-section">

<div
class="gallery-grid"
id="galleryGrid">

</div>

</section>

<!-- FIREBASE -->

<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

collection,

getDocs,

query,

orderBy

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCPCVms848PCesjDjt03yhrpoiBFZry0nE",

  authDomain:
  "eben-cooling.firebaseapp.com",

  projectId:
  "eben-cooling",

  storageBucket:
  "eben-cooling.firebasestorage.app",

  messagingSenderId:
  "616090448214",

  appId:
  "1:616090448214:web:3ea5624bc97eeaf53da6f7"

};

/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* =========================
   LOAD GALLERY
========================= */

async function loadGallery(){

const galleryGrid =
document.getElementById(
"galleryGrid"
);

const loading =
document.getElementById(
"loading"
);

galleryGrid.innerHTML =
"";

try{

    const q =
    query(

    collection(db,"gallery"),

    orderBy("createdAt","desc")

    );

    const querySnapshot =
    await getDocs(q);

    loading.style.display =
    "none";

    querySnapshot.forEach((doc)=>{

        const data =
        doc.data();

        // IMAGE

        if(data.type === "image"){

            galleryGrid.innerHTML +=

            `
            <div class="gallery-item">

            <img
            src="${data.url}"
            alt="Gallery Image">

            </div>
            `;

        }

        // VIDEO

        else{

            galleryGrid.innerHTML +=

            `
            <div class="gallery-item">

            <video controls>

            <source
            src="${data.url}"
            type="video/mp4">

            </video>

            </div>
            `;

        }

    });

}

catch(error){

    console.log(error);

    loading.innerHTML =
    "Failed to load gallery";

}

}

loadGallery();

</script>
